name: Android Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raingit-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare release signing
        shell: bash
        env:
          SIGNING_JKS_B64: ${{ secrets.RAINGIT_KEYSTORE_BASE64 }}
          SIGNING_PASS: ${{ secrets.RAINGIT_STORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.RAINGIT_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.RAINGIT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_JKS_B64" || -z "$SIGNING_PASS" || -z "$SIGNING_ALIAS" || -z "$SIGNING_KEY_PASS" ]]; then
            echo '::error::缺少固定 Release 签名。请在 Termux 的 RainGit 源码目录执行 bash scripts/setup-signing.sh 后重新运行。'
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/raingit-release.jks"
          printf '%s' "$SIGNING_JKS_B64" | base64 --decode > "$KEYSTORE"
          if [[ ! -s "$KEYSTORE" ]]; then
            echo '::error::签名文件为空或无法解码'
            exit 1
          fi
          chmod 600 "$KEYSTORE"
          echo "::add-mask::$SIGNING_PASS"
          echo "::add-mask::$SIGNING_KEY_PASS"
          {
            printf 'RAINGIT_SIGNING_STORE_FILE=%s\n' "$KEYSTORE"
            printf 'RAINGIT_SIGNING_STORE_PASSWORD=%s\n' "$SIGNING_PASS"
            printf 'RAINGIT_SIGNING_KEY_ALIAS=%s\n' "$SIGNING_ALIAS"
            printf 'RAINGIT_SIGNING_KEY_PASSWORD=%s\n' "$SIGNING_KEY_PASS"
          } >> "$GITHUB_ENV"
          echo '固定 Release 签名已就绪'
      - name: Build signed Release
        run: gradle --no-daemon --max-workers=2 :app:assembleRelease
      - name: Verify Release signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          APK_BYTES="$(stat -c%s "$APK")"
          if (( APK_BYTES < 1048576 )); then
            echo "::error::Release APK is unexpectedly small ($APK_BYTES bytes)."
            exit 1
          fi
          echo "Release APK: $APK_BYTES bytes ($(du -h "$APK" | cut -f1))"
      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RainGit-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
